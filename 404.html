<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages serves this file for ANY unmatched path on a project
      // site (e.g. /portfolio/some-broken-link). Instead of showing GitHub's
      // generic 404, we re-encode the path into a query string and redirect
      // to index.html, which decodes it back (see the script in index.html's
      // <head>) so React Router mounts and renders our themed 404 page.
      var pathSegmentsToKeep = 1; // keep "/portfolio" as the base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
