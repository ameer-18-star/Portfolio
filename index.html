  <script>
    // Single Page Apps for GitHub Pages: decode the redirect from
    // /404.html back into a real path BEFORE React Router mounts, so
    // deep-links/refreshes land on the right route (or the themed 404
    // catch-all if the path genuinely doesn't exist in the app).
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
